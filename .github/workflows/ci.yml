name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: smoke test
        shell: bash
        run: printf '\n%.0s' {1..40} | ./target/release/tlk-see.exe -n 3
