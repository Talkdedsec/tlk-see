name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: smoke test
        shell: bash
        run: |
          bin=target/release/tlk-see
          [ -f "$bin.exe" ] && bin="$bin.exe"
          printf '\n%.0s' {1..40} | "$bin" -n 3
