name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: smoke test
        shell: bash
        run: |
          bin=target/release/tlk-see
          [ -f "$bin.exe" ] && bin="$bin.exe"
          printf '\n%.0s' {1..40} | "$bin" -n 3
      # Two ports of the same oracle drift unless something checks. The same
      # record has to read the same in Rust and in the browser build.
      - name: record parity
        shell: bash
        env:
          REC: f7f823fc4423d34423742423
          WANT: "CATCHING 39|SELDOMNESS 33|TASK 28|2027-08-17"
        run: |
          bin=target/release/tlk-see
          [ -f "$bin.exe" ] && bin="$bin.exe"
          rust=$("$bin" --hex "$REC" -n 3 --day 20758 --quiet |
            awk '/^  [A-Z]+ +[0-9]+%$/ {printf "%s %s|", $1, $2}
                 /^  [0-9]{4}-[0-9]{2}-[0-9]{2}/ {printf "%s", $1}' |
            tr -d '%')
          js=$(node web/parity.mjs "$REC" 3 20758)
          echo "rust: $rust"
          echo "js:   $js"
          test "$rust" = "$WANT" && test "$js" = "$WANT"
